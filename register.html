<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Ethio Travel System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <button onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle Theme">🌓</button>

    <div class="auth-box hero-bg">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <input type="text" id="regUser" name="username" placeholder="Choose Username or Phone" required>
            <input type="password" id="regPass" name="password" placeholder="Create Password" required>
            <button type="submit" class="btn-primary">Register & Continue</button>
        </form>

        <p style="margin-top: 15px;">Already have an account? <a href="login.html" style="color: #3498db;">Login here</a> | <a href="index.html" style="color: #3498db;">Back to Home</a></p>
    </div>

    <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('regUser').value;
        const pass = document.getElementById('regPass').value;
        
        // Save to localStorage for login autofill & suggestions
        localStorage.setItem('registered_user', user);
        localStorage.setItem('registered_pass', pass);
        localStorage.setItem('current_user', user);
        
        alert('Registration successful! Redirecting to dashboard...');
        window.location.href = 'dashboard.html';
    });

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark-mode');
    }
    </script>
</body>
</html>
