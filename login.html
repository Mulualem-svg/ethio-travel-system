<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Ethio Travel System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <button onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle Theme">🌓</button>

    <div class="auth-box hero-bg">
        <h2>Login to Your Account</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" name="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="loginPass" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" class="btn-primary">Login</button>
        </form>

        <p style="margin-top: 15px;">Don't have an account? <a href="register.html" style="color: #3498db;">Register here</a> | <a href="index.html" style="color: #3498db;">Back to Home</a></p>
    </div>

    <script>
    // Autofill suggestions if previously registered
    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('registered_user');
        const savedPass = localStorage.getItem('registered_pass');
        if(savedUser) document.getElementById('loginUser').value = savedUser;
        if(savedPass) document.getElementById('loginPass').value = savedPass;
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        localStorage.setItem('current_user', user);
        window.location.href = 'dashboard.html';
    });

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark-mode');
    }
    </script>
</body>
</html>
