<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Route & Payment Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3 id="navTitle">Navigation</h3>
            <ul>
                <li><a href="dashboard.html" id="navOverview">Overview</a></li>
                <li><a href="payment.html" class="active" id="navRoute">Route & Payment</a></li>
                <li><a href="bookings.html">My Bookings</a></li>
                <li><a href="admin.html">Admin Panel</a></li>
                <li><a href="logout.html" id="navLogout">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h1 id="pageTitle">Intercity Bus Booking & Secure Checkout</h1>
            
            <form id="bookingForm" class="auth-box hero-bg" style="max-width: 100%; margin: 20px 0; text-align: left;">
                <h3 id="section1Title">1. Select Route & Travel Date (30+ Cities)</h3>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelFrom">From City:</label>
                        <select name="origin" id="originSelect" required>
                            <option value="" id="optOriginDefault">Select Origin City</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelTo">To City:</label>
                        <select name="destination" id="destSelect" required>
                            <option value="" id="optDestDefault">Select Destination City</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelDate">Travel Date:</label>
                        <input type="date" name="date" id="dateInput" required>
                    </div>
                </div>

                <h3 id="section2Title">2. Choose Bus Operator, Seat & Fare</h3>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
                    <div style="flex: 2; min-width: 250px;">
                        <label id="labelBus">Available Bus Fleet:</label>
                        <select name="bus" id="busSelect" required>
                            <option value="" id="optBusDefault">Select Bus Operator</option>
                            <option value="Haile Luxury Coach">Haile Bus (Luxury Coach)</option>
                            <option value="Abay Intercity">Abay Bus</option>
                            <option value="Odaa Express">Odaa Bus</option>
                            <option value="Public Transport">Public Bus Service</option>
                            <option value="FM Express">FM Bus</option>
                            <option value="Ethio Bus">Ethio Bus</option>
                            <option value="Walya Transport">Walya Bus</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label id="labelFare">Fare Calculation:</label>
                        <div id="fareDisplay" style="padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; color: #2ecc71; font-weight: bold;">
                            ⚡ Auto-calculated by Distance (KM)
                        </div>
                    </div>
                </div>

                <!-- Seat Selection UI Integration -->
                <div style="margin-bottom: 20px; background: var(--bg-color); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color);">
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;" id="labelSeat">Select Bus Seat (1 - 12):</label>
                    <div id="seatGrid" style="display: grid; grid-template-columns: repeat(6, 40px); gap: 10px;">
                        <!-- Generated via JS -->
                    </div>
                    <input type="hidden" id="selectedSeat" required>
                </div>

                <h3 id="section3Title">3. Mobile Payment & Transaction ID</h3>
                <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelProvider">Payment Provider:</label>
                        <select name="provider" id="providerSelect" required>
                            <option value="Telebirr">Telebirr</option>
                            <option value="CBE Birr">CBE Birr</option>
                            <option value="CBE">Commercial Bank of Ethiopia (CBE)</option>
                            <option value="Awash Bank">Awash Bank</option>
                            <option value="Coop Bank">Cooperative Bank of Oromia</option>
                            <option value="Amhara Bank">Amhara Bank</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelAccountInput">Phone / Account Number:</label>
                        <input type="text" name="phone" id="accountInput" placeholder="09xxxxxxxx" required>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label id="labelTxn">Transaction Number (TXN ID):</label>
                        <input type="text" name="txn_id" placeholder="e.g., TXN12345678" required>
                    </div>
                </div>

                <button type="submit" class="btn-secondary" id="payButton">Confirm Booking & Pay</button>
            </form>
        </main>
    </div>

   <script>
    const ethiopianCities = [
        "Addis Ababa", "Bahir Dar", "Gondar", "Hawassa", "Mekelle", "Dire Dawa",
        "Adama (Nazret)", "Jimma", "Dessie", "Bishoftu (Debre Zeyit)", "Jijiga",
        "Shashemene", "Arba Minch", "Hosaena", "Harar", "Dilla", "Nekemte",
        "Debre Markos", "Sodo", "Weldiya", "Debre Tabor", "Kombolcha", "Assosa",
        "Gambela", "Semera", "Butajira", "Goba", "Ambo", "Ziway (Batu)", 
        "Axum", "Lalibela", "Bale Robe", "Metu", "Finote Selam", "Wolkite"
    ].sort();

    const originSelect = document.getElementById('originSelect');
    const destSelect = document.getElementById('destSelect');

    ethiopianCities.forEach(city => {
        originSelect.innerHTML += `<option value="${city}">${city}</option>`;
        destSelect.innerHTML += `<option value="${city}">${city}</option>`;
    });

    const busSelect = document.getElementById('busSelect');
    const fareDisplay = document.getElementById('fareDisplay');

    function updateFarePreview() {
        const origin = originSelect.value;
        const destination = destSelect.value;
        const bus = busSelect.value;

        if (!origin || !destination || origin === destination) {
            const currentLang = localStorage.getItem('preferred_lang');
            if (currentLang === 'am') {
                fareDisplay.innerHTML = "⚡ እባክዎ የተለየ መነሻ እና መድረሻ ይምረጡ";
            } else if (currentLang === 'om') {
                fareDisplay.innerHTML = "⚡ Kaumsaa fi Gahuu adda addaa filadhaa";
            } else if (currentLang === 'ti') {
                fareDisplay.innerHTML = "⚡ እባክዎ ዝተፈላለየ መበገስን መእተውን ምረጡ";
            } else if (currentLang === 'so') {
                fareDisplay.innerHTML = "⚡ Dooro meelaha kala duwan ee ka bixitaanka & tagitaanka";
            } else {
                fareDisplay.innerHTML = "⚡ Select different origin & destination";
            }
            return;
        }

        let km = Math.abs(origin.length - destination.length) * 45 + 280;
        if(origin === "Addis Ababa" || destination === "Addis Ababa") km = 450;

        let rate = 3.5;
        if (bus.includes('Luxury') || bus.includes('Abay')) rate = 5.0;
        else if (bus.includes('Express')) rate = 4.2;

        const total = (km * rate).toFixed(2);
        fareDisplay.dataset.fareValue = `${total} ETB (~${km} km)`;
        fareDisplay.innerHTML = `💰 Estimated: ${total} ETB (~${km} km)`;
    }

    originSelect.addEventListener('change', updateFarePreview);
    destSelect.addEventListener('change', updateFarePreview);
    busSelect.addEventListener('change', updateFarePreview);

    // Interactive Seat Selection Generation
    const seatGrid = document.getElementById('seatGrid');
    const selectedSeatInput = document.getElementById('selectedSeat');

    for(let i = 1; i <= 12; i++) {
        const seat = document.createElement('div');
        seat.innerText = i;
        seat.style.cssText = "width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #34495e; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;";
        
        // Randomly simulate occupied seats (e.g. seats 3 and 7)
        if(i === 3 || i === 7) {
            seat.style.background = '#7f8c8d';
            seat.style.cursor = 'not-allowed';
        } else {
            seat.onclick = function() {
                document.querySelectorAll('#seatGrid div').forEach(s => {
                    if(s.style.background !== 'rgb(127, 140, 141)') s.style.background = '#34495e';
                });
                seat.style.background = '#2ecc71';
                selectedSeatInput.value = i;
            };
        }
        seatGrid.appendChild(seat);
    }

    // Dynamic Account Label Switching based on Provider Selection
    const providerSelect = document.getElementById('providerSelect');
    const accountInput = document.getElementById('accountInput');
    const labelAccountInput = document.getElementById('labelAccountInput');

    function updateAccountLabel() {
        const selectedProvider = providerSelect.value;
        const currentLang = localStorage.getItem('preferred_lang') || 'en';
        const isBank = (selectedProvider !== 'Telebirr' && selectedProvider !== 'CBE Birr');

        if (currentLang === 'am') {
            labelAccountInput.innerText = isBank ? 'የባንክ ሂሳብ ቁጥር:' : 'ስልክ / የኪስ ቦርሳ ቁጥር:';
            accountInput.placeholder = isBank ? 'እባክዎ ትክክለኛ የባንክ ሂሳብ ቁጥር ያስገቡ' : '09xxxxxxxx';
        } else if (currentLang === 'om') {
            labelAccountInput.innerText = isBank ? 'Lakkoofsa Herrega Baankii:' : 'Lakkoofsa Bilbilaa / Wallet:';
            accountInput.placeholder = isBank ? 'Lakkoofsa herrega baankii galchaa' : '09xxxxxxxx';
        } else if (currentLang === 'ti') {
            labelAccountInput.innerText = isBank ? 'ቁጽሪ ሕሳብ ባንክ:' : 'ቁጽሪ ስልኪ / ኪስ ቦርሳ:';
            accountInput.placeholder = isBank ? 'ቁጽሪ ሕሳብ ባንክ ኣእቱ' : '09xxxxxxxx';
        } else if (currentLang === 'so') {
            labelAccountInput.innerText = isBank ? 'Lambarka Akoonka Bankiga:' : 'Lambarka Telefoonka / Wallet:';
            accountInput.placeholder = isBank ? 'Geli lambarka akoonka bankiga' : '09xxxxxxxx';
        } else {
            labelAccountInput.innerText = isBank ? 'Bank Account Number:' : 'Phone / Wallet Number:';
            accountInput.placeholder = isBank ? 'Enter bank account number' : '09xxxxxxxx';
        }
    }

    providerSelect.addEventListener('change', updateAccountLabel);
    window.addEventListener('DOMContentLoaded', updateAccountLabel);

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if(!selectedSeatInput.value) {
            alert('Please select an available seat from the seat grid!');
            return;
        }

        const selectedProvider = providerSelect.value;
        const accountValue = accountInput.value.trim();
        const isBank = (selectedProvider !== 'Telebirr' && selectedProvider !== 'CBE Birr');

        if (isBank) {
            const bankRegex = /^\d{10,16}$/;
            if (!bankRegex.test(accountValue) || accountValue.startsWith('09') || accountValue.startsWith('07')) {
                alert('Invalid Bank Account! Traditional bank accounts cannot be mobile numbers starting with 09 or 07. Please enter a valid bank account number.');
                accountInput.focus();
                return;
            }
        } else {
            const phoneRegex = /^(09|07)\d{8}$/;
            if (!phoneRegex.test(accountValue)) {
                alert('Please enter a valid mobile number starting with 09 or 07 (10 digits total).');
                accountInput.focus();
                return;
            }
        }
        
        const bookingData = {
            ticketNo: 'ET-' + Math.random().toString(36).substring(2, 10).toUpperCase(),
            origin: originSelect.value,
            destination: destSelect.value,
            date: document.getElementById('dateInput').value,
            bus: busSelect.value,
            seat: selectedSeatInput.value,
            fare: fareDisplay.dataset.fareValue || '3107.50 ETB (~565 km)',
            provider: providerSelect.value,
            account: accountInput.value,
            status: 'PAID & CONFIRMED',
            timestamp: new Date().toISOString()
        };

        // Multi-booking storage array integration
        let allBookings = JSON.parse(localStorage.getItem('user_bookings')) || [];
        allBookings.unshift(bookingData);
        localStorage.setItem('user_bookings', JSON.stringify(allBookings));
        localStorage.setItem('user_booking', JSON.stringify(bookingData));

        alert('Payment successful and booking confirmed!');
        window.location.href = 'dashboard.html';
    });

    // Multi-Language Support Script
    function applyLanguage(lang) {
        if (lang === 'am') {
            document.getElementById('navTitle').innerText = 'ማውጫ';
            document.getElementById('navOverview').innerText = 'አጠቃላይ እይታ';
            document.getElementById('navRoute').innerText = 'መስመር እና ክፍያ';
            document.getElementById('navLogout').innerText = 'ውጣ';
            document.getElementById('pageTitle').innerText = 'የከተማ አቋራጭ አውቶቡስ ትኬት እና ደህንነቱ የተጠበቀ ክፍያ';
            document.getElementById('section1Title').innerText = '1. መነሻ፣ መድረሻ እና የጉዞ ቀን ይምረጡ';
            document.getElementById('labelFrom').innerText = 'የመነሻ ከተማ:';
            document.getElementById('labelTo').innerText = 'የመድረሻ ከተማ:';
            document.getElementById('labelDate').innerText = 'የጉዞ ቀን:';
            document.getElementById('section2Title').innerText = '2. አውቶቡስ፣ መቀመጫ እና ታሪፍ ይምረጡ';
            document.getElementById('labelBus').innerText = 'የሚገኙ አውቶቡሶች:';
            document.getElementById('labelFare').innerText = 'የታሪፍ ስሌት:';
            document.getElementById('labelSeat').innerText = 'የመቀመጫ ቁጥር ይምረጡ (1 - 12):';
            document.getElementById('section3Title').innerText = '3. የክፍያ አማራጭ እና የግብይት መለያ (TXN ID)';
            document.getElementById('labelProvider').innerText = 'የክፍያ አገልግሎት ሰጪ:';
            document.getElementById('labelTxn').innerText = 'የግብይት ቁጥር (TXN ID):';
            document.getElementById('payButton').innerText = 'ትኬት ይቁረጡ & ይክፈሉ';
            document.getElementById('optOriginDefault').innerText = 'የመነሻ ከተማ ይምረጡ';
            document.getElementById('optDestDefault').innerText = 'የመድረሻ ከተማ ይምረጡ';
            document.getElementById('optBusDefault').innerText = 'የአውቶቡስ ድርጅት ይምረጡ';
        } else if (lang === 'om') {
            document.getElementById('navTitle').innerText = 'Kallattii';
            document.getElementById('navOverview').innerText = 'Gabaasa Waliigalaa';
            document.getElementById('navRoute').innerText = 'Karaa & Kaffaltii';
            document.getElementById('navLogout').innerText = 'Ba\'i';
            document.getElementById('pageTitle').innerText = 'Qabiyyee Imala Magaalota Gidduu & Kaffaltii';
            document.getElementById('section1Title').innerText = '1. Magaalaa Kaumsaa & Guyyaa Imala Filadhu';
            document.getElementById('labelFrom').innerText = 'Magaalaa Kaumsaa:';
            document.getElementById('labelTo').innerText = 'Magaalaa Gahuu:';
            document.getElementById('labelDate').innerText = 'Guyyaa Imala:';
            document.getElementById('section2Title').innerText = '2. Konkolaachisaa Bus, Teessoo & Kaffaltii Filadhu';
            document.getElementById('labelBus').innerText = 'Konkolaattota Jiran:';
            document.getElementById('labelFare').innerText = 'Herrega Kaffaltii:';
            document.getElementById('labelSeat').innerText = 'Teessoo Filadhu (1 - 12):';
            document.getElementById('section3Title').innerText = '3. Filannoo Kaffaltii & Lakkoofsa Dabarsaa';
            document.getElementById('labelProvider').innerText = 'Dhaabbata Kaffaltii:';
            document.getElementById('labelTxn').innerText = 'Lakkoofsa Dabarsaa (TXN ID):';
            document.getElementById('payButton').innerText = 'Kaffalii & Mirkaneessi';
            document.getElementById('optOriginDefault').innerText = 'Magaalaa Kaumsaa Filadhu';
            document.getElementById('optDestDefault').innerText = 'Magaalaa Gahuu Filadhu';
            document.getElementById('optBusDefault').innerText = 'Konkolaachisaa Bus Filadhu';
        } else if (lang === 'ti') {
            document.getElementById('navTitle').innerText = 'መተሓሳሰቢ';
            document.getElementById('navOverview').innerText = 'ጠቓላ ርእየት';
            document.getElementById('navRoute').innerText = 'መስመርን ክፍያን';
            document.getElementById('navLogout').innerText = 'ውጻእ';
            document.getElementById('pageTitle').innerText = 'ትኬት ጉዕዞ ከተማን ድሕንነት ዘለዎ ክፍያን';
            document.getElementById('section1Title').innerText = '1. መበገሲ፣ መእተውን ዕለተ ጉዕዞን ምረጡ';
            document.getElementById('labelFrom').innerText = 'መበገሲ ከተማ:';
            document.getElementById('labelTo').innerText = 'መእተዊ ከተማ:';
            document.getElementById('labelDate').innerText = 'ዕለተ ጉዕዞ:';
            document.getElementById('section2Title').innerText = '2. ኣውቶቡስ፣ መንበርን ክፍያን ምረጡ';
            document.getElementById('labelBus').innerText = 'ዝርከቡ ኣውቶቡሳት:';
            document.getElementById('labelFare').innerText = 'ቅጥዕና ክፍያ:';
            document.getElementById('labelSeat').innerText = 'ቁጽሪ መንበር ምረጡ (1 - 12):';
            document.getElementById('section3Title').innerText = '3. መማረጺ ክፍያን ቁጽሪ ትራንዛክሽንን';
            document.getElementById('labelProvider').innerText = 'መራኸቢ ክፍያ:';
            document.getElementById('labelTxn').innerText = 'ቁጽሪ ትራንዛክሽን (TXN ID):';
            document.getElementById('payButton').innerText = 'ጉዕዞ ኣረጋግጽ & ክፈል';
            document.getElementById('optOriginDefault').innerText = 'መበገሲ ከተማ ምረጡ';
            document.getElementById('optDestDefault').innerText = 'መእተዊ ከተማ ምረጡ';
            document.getElementById('optBusDefault').innerText = 'ኣውቶቡስ ኣገልግሎት ምረጡ';
        } else if (lang === 'so') {
            document.getElementById('navTitle').innerText = 'Hagaha';
            document.getElementById('navOverview').innerText = 'Guud mar';
            document.getElementById('navRoute').innerText = 'Waddada & Lacag Bixinta';
            document.getElementById('navLogout').innerText = 'Ka Bax';
            document.getElementById('pageTitle').innerText = 'Ballamaha Basaska & Lacag Bixinta Ammaan ah';
            document.getElementById('section1Title').innerText = '1. Dooro Waddada & Taariikhda Safarka';
            document.getElementById('labelFrom').innerText = 'Magaalada Ka Bixitaanka:';
            document.getElementById('labelTo').innerText = 'Magaalada Tagitaanka:';
            document.getElementById('labelDate').innerText = 'Taariikhda Safarka:';
            document.getElementById('section2Title').innerText = '2. Dooro Shirkadda Baska, Kursiga & Qiimaha';
            document.getElementById('labelBus').innerText = 'Basaska Diyaarka Ah:';
            document.getElementById('labelFare').innerText = 'Xisaabinta Lacagta:';
            document.getElementById('labelSeat').innerText = 'Dooro Kursiga (1 - 12):';
            document.getElementById('section3Title').innerText = '3. Habka Bixinta & Lambarka Macaamilka';
            document.getElementById('labelProvider').innerText = 'Shirkadda Lacag Bixinta:';
            document.getElementById('labelTxn').innerText = 'Lambarka Macaamilka (TXN ID):';
            document.getElementById('payButton').innerText = 'Xaqiiji Ballamaha & Bixi';
            document.getElementById('optOriginDefault').innerText = 'Dooro Magaalada Ka Bixitaanka';
            document.getElementById('optDestDefault').innerText = 'Dooro Magaalada Tagitaanka';
            document.getElementById('optBusDefault').innerText = 'Dooro Shirkadda Baska';
        }
        updateAccountLabel();
    }

    const savedLang = localStorage.getItem('preferred_lang');
    if (savedLang) {
        applyLanguage(savedLang);
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark-mode');
    }
    </script>
</body>
</html>
