<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Ethio Travel System</title>
    <style>
        body.auth-body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111;
            position: relative;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Left Side Background */
        body.auth-body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            filter: brightness(0.45);
            z-index: 1;
        }

        /* Right Side Background */
        body.auth-body::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            filter: brightness(0.45);
            z-index: 1;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 25px;
        }

        .login-card {
            background: rgba(22, 22, 22, 0.95);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
        }

        .login-card h2 {
            text-align: center;
            color: #3498db;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid #555;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            background-color: #f0f4f8;
            color: #111;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.9);
            border-color: #3498db;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #2980b9;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #ccc;
            font-size: 15px;
        }

        .auth-footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-body">

    <div class="login-wrapper">
        <div class="login-card">
            <h2>User Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="text" id="loginIdentifier" placeholder="Enter Full Name or Phone Number" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a> | <a href="index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;

            // Retrieve registered data from localStorage
            const savedName = localStorage.getItem('ets_user_name');
            const savedPhone = localStorage.getItem('ets_user_phone');
            const savedPassword = localStorage.getItem('ets_user_password');

            // Check if user exists and credentials match
            const isMatch = (identifier === savedName || identifier === savedPhone) && (password === savedPassword);

            if (isMatch) {
                // Set session flags so dashboard.html recognizes you are logged in
                localStorage.setItem('ets_logged_in', 'true');
                
                alert("Login successful! Welcome back, " + (savedName || "User"));
                window.location.href = 'dashboard.html'; 
            } else {
                alert("Invalid credentials or you are not registered yet. Please register first.");
            }
        }
    </script>
</body>
</html>
